name: Update Tampere gig data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Every day at 05:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "tampere-keikat-scrape"
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    name: Update data.json and deploy Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run scraper
        run: |
          python scrape.py

      - name: Sync with remote main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git rebase origin/main || git merge --no-edit origin/main || true

      - name: Check for changes to data.json
        id: check_changes
        run: |
          if git status --porcelain --untracked-files=no | grep -q '^'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit data.json (if changed)
        if: steps.check_changes.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: 'chore: update data.json (scraped)'
          add: 'data.json'
          push: true

      - name: Prepare Pages content
        run: |
          rm -rf out
          mkdir -p out
          # copy only the files you want to publish (exclude .git and workflow files)
          rsync -av --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='node_modules' ./ out/
          # If you want to publish only certain files, replace the rsync with targeted copy commands

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
