name: Update Tampere gig data and deploy

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Every day at 05:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "tampere-keikat-scrape"
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    name: Update data.json and deploy Pages
    runs-on: ubuntu-latest
    # Safety net: without this, a hung step (e.g. a Playwright page stuck
    # waiting on a Cloudflare challenge that never resolves) could run for
    # GitHub's default 360-minute job limit, burning Actions minutes for
    # no benefit. 40 minutes is generous for 5 sources running in parallel
    # (keikkalista's ~86 venue pages are the slow part) but still bounded.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps

      - name: Run scraper
        run: |
          python scrape.py 2>&1 | tee scrape.log
          # tee keeps the log visible live in the Actions console AND
          # saves it to a file below, for the artifact upload step.

      - name: Upload scraper log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-log-${{ github.run_number }}
          path: scrape.log
          retention-days: 30
          # if: always() means this uploads even if the scraper step above
          # failed or timed out — that's exactly when you most want the log.

      - name: Sync with remote main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git rebase origin/main || git merge --no-edit origin/main || true

      - name: Check for changes to data.json
        id: check_changes
        run: |
          if git status --porcelain --untracked-files=no | grep -q '^'; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit data.json (if changed)
        if: steps.check_changes.outputs.changed == 'true'
        uses: EndBug/add-and-commit@v9
        with:
          author_name: 'github-actions[bot]'
          author_email: '41898282+github-actions[bot]@users.noreply.github.com'
          message: 'chore: update data.json (scraped)'
          add: 'data.json'
          push: true

      - name: Prepare Pages content
        run: |
          rm -rf out
          mkdir -p out
          # copy only the files you want to publish (exclude .git, workflow files, and the scrape log)
          rsync -av --exclude='.git' --exclude='.github' --exclude='.gitignore' --exclude='node_modules' --exclude='scrape.log' ./ out/
          # If you want to publish only certain files, replace the rsync with targeted copy commands

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'out'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
